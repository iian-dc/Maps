<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Solicita tu transporte</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f3f3}
.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}
.map-container{position:relative;width:100%;height:52vh;min-height:380px}
#map{width:100%;height:100%}
.panel{position:relative;z-index:1001;background:#fff;margin-top:-20px;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -4px 15px rgba(0,0,0,.15)}
.title{font-size:21px;font-weight:bold;margin-bottom:5px}
.subtitle{font-size:13px;color:#777;margin-bottom:15px}
.mode{display:flex;gap:8px;margin-bottom:10px}
.mode button{flex:1;border:1px solid #ddd;background:#fff;color:#555;border-radius:10px;padding:12px;font-size:14px;font-weight:bold}
.mode button.active{background:#f5c400;color:#111;border-color:#f5c400}
.location-button{width:100%;border:0;border-radius:12px;padding:14px;background:#f5c400;color:#111;font-size:13px;font-weight:bold;margin-bottom:12px}
.step{background:#f5f5f5;border-radius:12px;padding:12px;margin-bottom:9px}
.step-title{font-size:11px;color:#777;margin-bottom:5px}
.address{font-size:14px;font-weight:bold;line-height:19px}
.waiting{color:#999;font-weight:normal}
.start-button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:6px;background:#f5c400;color:#111;font-size:17px;font-weight:bold}
.start-button:disabled{background:#aaa;color:#fff}
.status{text-align:center;font-size:12px;color:#777;margin-top:9px;min-height:16px}
.pickup-icon,.destination-icon{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pickup-icon{background:#f5c400}
.destination-icon{background:#111}
.marker-dot{width:10px;height:10px;background:#fff;border-radius:50%}
.vehicle-screen{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end}
.vehicle-screen.show{display:flex}
.vehicle-panel{width:100%;max-width:600px;margin:auto;background:#111;color:#fff;border-radius:24px 24px 0 0;padding:14px 18px 22px}
.handle{width:55px;height:5px;background:#555;border-radius:10px;margin:0 auto 16px}
.vehicle-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:5px}
.vehicle-subtitle{text-align:center;color:#aaa;font-size:13px;margin-bottom:16px}
.vehicle-option{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:2px solid transparent;border-radius:15px;background:#1d1d1d;margin-bottom:10px;cursor:pointer}
.vehicle-option.selected{border-color:#f5c400}
.vehicle-icon{font-size:40px;width:55px;text-align:center}
.vehicle-info{flex:1}
.vehicle-name{font-size:18px;font-weight:bold}
.vehicle-text{font-size:12px;color:#aaa;margin-top:4px}
.vehicle-distance{font-size:13px;color:#ccc;margin-top:7px}
.vehicle-price{font-size:21px;font-weight:bold;color:#f5c400;margin-top:4px}
