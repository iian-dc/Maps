<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Solicita tu transporte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f3f3}
.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}
.map-container{position:relative;width:100%;height:52vh;min-height:380px}
#map{width:100%;height:100%}
.panel{position:relative;z-index:1001;background:#fff;margin-top:-20px;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -4px 15px rgba(0,0,0,.15)}
.title{font-size:21px;font-weight:bold;margin-bottom:5px}
.subtitle{font-size:13px;color:#777;margin-bottom:15px}
.mode{display:flex;gap:8px;margin-bottom:10px}
.mode button{flex:1;border:1px solid #ddd;background:#fff;color:#555;border-radius:10px;padding:12px;font-size:14px;font-weight:bold}
.mode button.active{background:#f5c400;color:#111;border-color:#f5c400}
.location-button{width:100%;border:0;border-radius:12px;padding:14px;background:#f5c400;color:#111;font-size:13px;font-weight:bold;margin-bottom:12px}
.step{background:#f5f5f5;border-radius:12px;padding:12px;margin-bottom:9px}
.step-title{font-size:11px;color:#777;margin-bottom:5px}
.address{font-size:14px;font-weight:bold;line-height:19px}
.waiting{color:#999;font-weight:normal}
.start-button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:6px;background:#f5c400;color:#111;font-size:17px;font-weight:bold}
.start-button:disabled{background:#aaa;color:#fff}
.status{text-align:center;font-size:12px;color:#777;margin-top:9px;min-height:16px}
.pickup-icon,.destination-icon{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pickup-icon{background:#f5c400}
.destination-icon{background:#111}
.marker-dot{width:10px;height:10px;background:#fff;border-radius:50%}
.vehicle-screen{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end}
.vehicle-screen.show{display:flex}
.vehicle-panel{width:100%;max-width:600px;margin:auto;background:#111;color:#fff;border-radius:24px 24px 0 0;padding:14px 18px 22px}
.handle{width:55px;height:5px;background:#555;border-radius:10px;margin:0 auto 16px}
.vehicle-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:5px}
.vehicle-subtitle{text-align:center;color:#aaa;font-size:13px;margin-bottom:16px}
.vehicle-option{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:2px solid transparent;border-radius:15px;background:#1d1d1d;margin-bottom:10px;cursor:pointer}
.vehicle-option.selected{border-color:#f5c400}
.vehicle-icon{font-size:40px;width:55px;text-align:center}
.vehicle-info{flex:1}
.vehicle-name{font-size:18px;font-weight:bold}
.vehicle-text{font-size:12px;color:#aaa;margin-top:4px}
.vehicle-distance{font-size:13px;color:#ccc;margin-top:7px}
.vehicle-price{font-size:21px;font-weight:bold;color:#f5c400;margin-top:4px}
.vehicle-check{width:24px;height:24px;border:2px solid #777;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vehicle-option.selected .vehicle-check{background:#f5c400;border-color:#f5c400;color:#111}
.vehicle-start{display:none;width:100%;border:0;border-radius:10px;padding:11px;margin-top:10px;background:#f5c400;color:#111;font-size:14px;font-weight:bold;cursor:pointer}
.vehicle-option.selected .vehicle-start{display:block}
.close-button{width:100%;border:0;background:transparent;color:#aaa;padding:13px;font-size:14px}

/* NUEVO: CONFIRMACIÓN DE RECOGIDA */
.confirm-screen{position:fixed;inset:0;background:#111;z-index:10000;display:none}
.confirm-screen.show{display:block}
#confirmMap{position:absolute;inset:0;width:100%;height:100%}
.confirm-top{position:absolute;top:0;left:0;right:0;z-index:1001;padding:18px}
.confirm-back{width:48px;height:48px;border:0;border-radius:50%;background:#111;color:#fff;font-size:28px;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.confirm-search{position:absolute;right:18px;top:18px;width:48px;height:48px;border:0;border-radius:50%;background:#111;color:#fff;font-size:25px;z-index:1002}
.confirm-panel{position:absolute;bottom:0;left:0;right:0;z-index:1001;background:#111;color:#fff;border-radius:24px 24px 0 0;padding:15px 18px 24px;box-shadow:0 -5px 20px rgba(0,0,0,.35)}
.confirm-handle{width:55px;height:5px;background:#555;border-radius:10px;margin:0 auto 16px}
.confirm-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:6px}
.confirm-subtitle{text-align:center;color:#aaa;font-size:13px;margin-bottom:16px}
.confirm-address{background:#1d1d1d;border-radius:14px;padding:13px;margin-bottom:12px}
.confirm-label{font-size:10px;color:#aaa;margin-bottom:5px}
.confirm-address-text{font-size:14px;font-weight:bold;line-height:19px}
.confirm-button{width:100%;border:0;border-radius:13px;padding:16px;background:#f5c400;color:#111;font-size:15px;font-weight:bold}
.confirm-button:disabled{background:#777;color:#aaa}
.confirm-pin{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#f5c400;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.confirm-pin-dot{width:10px;height:10px;background:#fff;border-radius:50%}
</style>
</head>
<body>

<div class="app">

<div class="map-container">
<div id="map"></div>
</div>

<div class="panel">

<div class="title">Solicita tu transporte</div>

<div class="subtitle" id="subtitle">
Selecciona el lugar donde te recogeremos.
</div>

<div class="mode">
<button id="pickupMode" class="active">Recogida</button>
<button id="destinationMode">Destino</button>
</div>

<button id="locationButton" class="location-button">
USAR MI UBICACIÓN ACTUAL
</button>

<div class="step">
<div class="step-title">PUNTO DE RECOGIDA</div>
<div id="pickupAddress" class="address waiting">
Toca el mapa para seleccionar
</div>
</div>

<div class="step">
<div class="step-title">DESTINO</div>
<div id="destinationAddress" class="address waiting">
Toca el mapa para seleccionar
</div>
</div>

<button id="startButton" class="start-button" disabled>
INICIAR
</button>

<div id="status" class="status"></div>

</div>
</div>

<div id="vehicleScreen" class="vehicle-screen">

<div class="vehicle-panel">

<div class="handle"></div>

<div class="vehicle-title">
Elige tu vehículo
</div>

<div class="vehicle-subtitle">
Selecciona cómo deseas realizar tu viaje
</div>
