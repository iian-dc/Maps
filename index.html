<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Solicita tu transporte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f3f3}
.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}
.map-container{position:relative;width:100%;height:52vh;min-height:380px}
#map{width:100%;height:100%}
.map-button{position:absolute;top:15px;left:15px;z-index:1000;background:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:bold;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.panel{position:relative;z-index:1001;background:#fff;margin-top:-20px;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -4px 15px rgba(0,0,0,.15)}
.title{font-size:21px;font-weight:bold;margin-bottom:5px}
.subtitle{font-size:13px;color:#777;margin-bottom:15px}
.mode{display:flex;gap:8px;margin-bottom:10px}
.mode button{flex:1;border:1px solid #ddd;background:#fff;color:#555;border-radius:10px;padding:12px;font-size:14px;font-weight:bold}
.mode button.active{background:#f5c400;color:#111;border-color:#f5c400}
.location-button{width:100%;border:0;border-radius:12px;padding:14px;background:#f5c400;color:#111;font-size:13px;font-weight:bold;margin-bottom:12px}
.step{background:#f5f5f5;border-radius:12px;padding:12px;margin-bottom:9px}
.step-title{font-size:11px;color:#777;margin-bottom:5px}
.address{font-size:14px;font-weight:bold;line-height:19px}
.waiting{color:#999;font-weight:normal}
.start-button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:6px;background:#f5c400;color:#111;font-size:17px;font-weight:bold}
.start-button:disabled{background:#aaa;color:#fff}
.status{text-align:center;font-size:12px;color:#777;margin-top:9px;min-height:16px}
.pickup-icon,.destination-icon{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pickup-icon{background:#f5c400}
.destination-icon{background:#111}
.marker-dot{width:10px;height:10px;background:#fff;border-radius:50%}

.vehicle-screen{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end}
.vehicle-screen.show{display:flex}
.vehicle-panel{width:100%;max-width:600px;margin:auto;background:#111;color:#fff;border-radius:24px 24px 0 0;padding:14px 18px 22px}
.handle{width:55px;height:5px;background:#555;border-radius:10px;margin:0 auto 16px}
.vehicle-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:5px}
.vehicle-subtitle{text-align:center;color:#aaa;font-size:13px;margin-bottom:16px}
.vehicle-option{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:2px solid transparent;border-radius:15px;background:#1d1d1d;margin-bottom:10px}
.vehicle-option.selected{border-color:#f5c400}
.vehicle-icon{font-size:43px;width:65px;text-align:center}
.vehicle-info{flex:1}
.vehicle-name{font-size:18px;font-weight:bold}
.vehicle-text{font-size:12px;color:#aaa;margin-top:4px}
.vehicle-check{width:24px;height:24px;border:2px solid #777;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vehicle-option.selected .vehicle-check{background:#f5c400;border-color:#f5c400;color:#111}
.close-button{width:100%;border:0;background:transparent;color:#aaa;padding:13px;font-size:14px}
</style>
</head>

<body>

<div class="app">

<div class="map-container">
<div id="map"></div>
<button class="map-button" id="centerButton">📍 Mi ubicación</button>
</div>

<div class="panel">

<div class="title">Solicita tu transporte</div>
<div class="subtitle" id="subtitle">Selecciona el lugar donde te recogeremos.</div>

<div class="mode">
<button id="pickupMode" class="active">Recogida</button>
<button id="destinationMode">Destino</button>
</div>

<button id="locationButton" class="location-button">USAR MI UBICACIÓN ACTUAL</button>

<div class="step">
<div class="step-title">PUNTO DE RECOGIDA</div>
<div id="pickupAddress" class="address waiting">Toca el mapa para seleccionar</div>
</div>

<div class="step">
<div class="step-title">DESTINO</div>
<div id="destinationAddress" class="address waiting">Toca el mapa para seleccionar</div>
</div>

<button id="startButton" class="start-button" disabled>INICIAR</button>

<div id="status" class="status"></div>

</div>
</div>

<div id="vehicleScreen" class="vehicle-screen">

<div class="vehicle-panel">

<div class="handle"></div>

<div class="vehicle-title">Elige tu vehículo</div>
<div class="vehicle-subtitle">Selecciona cómo deseas realizar tu viaje</div>

<div id="motoOption" class="vehicle-option">

<div class="vehicle-icon">🏍️</div>

<div class="vehicle-info">
<div class="vehicle-name">Moto</div>
<div class="vehicle-text">Transporte en motocicleta</div>
</div>

<div id="motoCheck" class="vehicle-check"></div>

</div>

<div id="carOption" class="vehicle-option">

<div class="vehicle-icon">🚗</div>

<div class="vehicle-info">
<div class="vehicle-name">Carro</div>
<div class="vehicle-text">Transporte en automóvil</div>
</div>

<div id="carCheck" class="vehicle-check"></div>

</div>

<button id="closeVehicle" class="close-button">Volver</button>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map("map",{zoomControl:true}).setView([21.1561,-100.9333],15);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:"© OpenStreetMap"
}).addTo(map);

let pickupLat=null;
let pickupLng=null;
let destinationLat=null;
let destinationLng=null;
let pickupMarker=null;
let destinationMarker=null;
let mode="pickup";

const pickupMode=document.getElementById("pickupMode");
const destinationMode=document.getElementById("destinationMode");
const pickupAddress=document.getElementById("pickupAddress");
const destinationAddress=document.getElementById("destinationAddress");
const startButton=document.getElementById("startButton");
const status=document.getElementById("status");

function pickupIcon(){
return L.divIcon({
className:"",
html:'<div class="pickup-icon"><div class="marker-dot"></div></div>',
iconSize:[36,36],
iconAnchor:[18,36]
});
}

function destinationIcon(){
return L.divIcon({
className:"",
html:'<div class="destination-icon"><div class="marker-dot"></div></div>',
iconSize:[36,36],
iconAnchor:[18,36]
});
}

function seleccionarModo(tipo){

mode=tipo;

if(tipo==="pickup"){
pickupMode.classList.add("active");
destinationMode.classList.remove("active");
document.getElementById("subtitle").innerText="Selecciona el lugar donde te recogeremos.";
}else{
destinationMode.classList.add("active");
pickupMode.classList.remove("active");
document.getElementById("subtitle").innerText="Selecciona el lugar donde quieres llegar.";
}
}

pickupMode.onclick=function(){
seleccionarModo("pickup");
};

destinationMode.onclick=function(){
seleccionarModo("destination");
};

map.on("click",function(e){

const lat=e.latlng.lat;
const lng=e.latlng.lng;

if(mode==="pickup"){

pickupLat=lat;
pickupLng=lng;

if(pickupMarker){
map.removeLayer(pickupMarker);
}

pickupMarker=L.marker([lat,lng],{
icon:pickupIcon()
}).addTo(map);

pickupAddress.innerText="Ubicación de recogida seleccionada";
pickupAddress.classList.remove("waiting");

seleccionarModo("destination");

status.innerText="Ahora selecciona el destino.";

}else{

destinationLat=lat;
destinationLng=lng;

if(destinationMarker){
map.removeLayer(destinationMarker);
}

destinationMarker=L.marker([lat,lng],{
icon:destinationIcon()
}).addTo(map);

destinationAddress.innerText="Ubicación de destino seleccionada";
destinationAddress.classList.remove("waiting");

if(pickupLat!==null){
startButton.disabled=false;
status.innerText="Recogida y destino seleccionados.";
}
}

});

document.getElementById("locationButton").onclick=function(){

if(!navigator.geolocation){
alert("Tu dispositivo no permite obtener la ubicación.");
return;
}

this.innerText="OBTENIENDO UBICACIÓN...";
status.innerText="Solicitando ubicación GPS...";

navigator.geolocation.getCurrentPosition(function(position){

const lat=position.coords.latitude;
const lng=position.coords.longitude;

pickupLat=lat;
pickupLng=lng;

if(pickupMarker){
map.removeLayer(pickupMarker);
}

pickupMarker=L.marker([lat,lng],{
icon:pickupIcon()
}).addTo(map);

map.setView([lat,lng],17);

pickupAddress.innerText="Mi ubicación actual";
pickupAddress.classList.remove("waiting");

seleccionarModo("destination");

document.getElementById("locationButton").innerText="UBICACIÓN SELECCIONADA";

status.innerText="Ahora selecciona el destino.";

},function(){

document.getElementById("locationButton").innerText="USAR MI UBICACIÓN ACTUAL";

status.innerText="No se pudo obtener la ubicación.";

alert("Permite el acceso a la ubicación para utilizar esta función.");

},{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
});

};

document.getElementById("centerButton").onclick=function(){

if(!navigator.geolocation){
return;
}

navigator.geolocation.getCurrentPosition(function(position){

map.setView([
position.coords.latitude,
position.coords.longitude
],17);

});

};

startButton.onclick=function(){

if(pickupLat===null||destinationLat===null){
return;
}

document.getElementById("vehicleScreen").classList.add("show");

};

document.getElementById("motoOption").onclick=function(){

document.getElementById("motoOption").classList.add("selected");
document.getElementById("carOption").classList.remove("selected");

document.getElementById("motoCheck").innerText="✓";
document.getElementById("carCheck").innerText="";

};

document.getElementById("carOption").onclick=function(){

document.getElementById("carOption").classList.add("selected");
document.getElementById("motoOption").classList.remove("selected");

document.getElementById("carCheck").innerText="✓";
document.getElementById("motoCheck").innerText="";

};

document.getElementById("closeVehicle").onclick=function(){

document.getElementById("vehicleScreen").classList.remove("show");

};

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(position){

map.setView([
position.coords.latitude,
position.coords.longitude
],15);

},function(){

map.setView([21.1561,-100.9333],15);

},{
enableHighAccuracy:true,
timeout:10000
});

}
</script>

</body>
                                                                </html>
